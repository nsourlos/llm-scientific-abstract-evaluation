[project]
name = "llm-abstract-evaluation"
version = "1.0.0"
description = "Evaluate and improve LLM-generated scientific abstracts"
requires-python = "==3.12.*"
dependencies = [
    "pandas==2.1.4",
    "numpy==1.26.2",
    "rouge-score==0.1.2",
    "sentence-transformers==5.1.1",
    "scikit-learn==1.3.2",
    "openai==2.1.0",
    "deepeval==0.21.73",
    "dspy==3.0.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.0",
    "tqdm==4.66.1",
    "python-dotenv==1.0.0",
    "jupyter==1.0.0",
    "ipykernel==6.27.1",
    "openpyxl==3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src"]
